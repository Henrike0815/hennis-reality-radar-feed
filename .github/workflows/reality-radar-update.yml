
name: Reality Radar Update

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Folgenliste prüfen
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("feed.json")
          if not path.exists():
              raise SystemExit("FEHLER: feed.json fehlt!")

          with path.open(encoding="utf-8") as f:
              feed = json.load(f)

          print("JSON ist gültig.")

          def find_episodes(value):
              if isinstance(value, dict):
                  if "id" in value and (
                      "availableOn" in value
                      or "episode" in value
                  ):
                      yield value

                  for child in value.values():
                      yield from find_episodes(child)

              elif isinstance(value, list):
                  for child in value:
                      yield from find_episodes(child)

          episodes = list(find_episodes(feed))
          ids = [str(ep["id"]) for ep in episodes]

          if not episodes:
              raise SystemExit(
                  "FEHLER: Keine Folgen gefunden!"
              )

          if len(ids) != len(set(ids)):
              from collections import Counter
              duplicates = [
                  key for key, count
                  in Counter(ids).items()
                  if count > 1
              ]
              raise SystemExit(
                  f"FEHLER: Doppelte IDs: {duplicates}"
              )

          print(f"Gefundene Folgen: {len(episodes)}")
          print("Alle Folgen-IDs sind eindeutig.")
          print("Reality Radar Prüfung erfolgreich!")
          PY

      - name: Love Island VIP Folgen vergleichen
        run: python3 check_love_island.py
      - name: RTL Plus Webseite testen und weitere Quellen diagnostizieren
        env:
          RTL_DIAGNOSTICS: '1'
        run: python3 check_rtl.py
      - name: Validate and commit updated feed
        run: |
          python3 -m json.tool feed.json > /dev/null

          git diff -- feed.json

          if git diff --quiet -- feed.json; then
            echo "Keine neuen Folgen zum Speichern."
            exit 0
          fi

          git config user.name "Reality Radar Butler"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add feed.json
          git commit -m "Reality Radar: neue Folgen automatisch aktualisiert"
          git push

